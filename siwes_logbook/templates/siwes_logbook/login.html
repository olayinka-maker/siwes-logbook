{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in to your SIWES Logbook account.">
    <title>Login — SIWES Logbook</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-card-header">
                <div class="auth-card-logo"></div>
                <h2>Welcome Back</h2>
                <p>Sign in to your SIWES Logbook account</p>
            </div>

            {% if messages %}
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }}" style="margin-bottom:16px;">
                <span>{{ message }}</span>
                <button class="alert-close" onclick="this.parentElement.remove()">✕</button>
            </div>
            {% endfor %}
            {% endif %}

            <form method="post" action="{% url 'login' %}" id="login-form">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_username">Username</label>
                    <input type="text" name="username" id="id_username" class="form-control" placeholder="Enter your username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="id_password">Password</label>
                    <input type="password" name="password" id="id_password" class="form-control" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;" id="login-submit-btn">
                    Sign In
                </button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account?</p>
                <p style="margin-top:8px;">
                    <a href="{% url 'register_student' %}">Register as Student</a>
                    &nbsp;·&nbsp;
                    <a href="{% url 'register_supervisor' %}">Register as Supervisor</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
